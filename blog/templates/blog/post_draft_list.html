{% extends 'blog/base.html' %}

{% block content %}
    <h2>Draft posts</h2>
    {% for post in posts %}
        <article class="post">
            <p class="date">Created: {{ post.create_date|date:'d-m-Y' }}</p>
            <h2><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h2>
            <p>{{ post.text|truncatechars:200 }}</p>
        </article>
    {% empty %}
        <p>You have no drafts yet.</p>
    {% endfor %}
{% endblock %}
