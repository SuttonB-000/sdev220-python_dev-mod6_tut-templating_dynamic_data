<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog</title>
</head>
<body>
    <header>
        <h1>My Blog</h1>
    </header>

    <main>
        {% for post in posts %}
            <article>
                <h2>{{ post.title }}</h2>
                <p>{{ post.text|linebreaksbr }}</p>
                {% if post.published_date %}
                    <p><small>Published {{ post.published_date }}</small></p>
                {% endif %}
            </article>
        {% empty %}
            <p>No posts have been published yet.</p>
        {% endfor %}
    </main>
</body>
</html>
