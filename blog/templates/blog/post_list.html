{% extends 'blog/base.html' %}

{% block content %}
    {% for post in posts %}
                    <article class="post">
                        <h2>{{ post.title }}</h2>
                        <p>{{ post.text|linebreaksbr }}</p>
                        {% if post.published_date %}
                            <time class="date">{{ post.published_date }}</time>
                        {% endif %}
                    </article>
                {% empty %}
                    <p>No posts have been added yet.</p>
                {% endfor %}
{% endblock %}
